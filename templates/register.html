<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Property Explorer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav>

        <div class="logo">
            🏠 Property Explorer
        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/login">
                Login
            </a>

        </div>

    </nav>


    <div class="auth-container">

        <div class="auth-box">

            <h1>Create Account</h1>

            <p>Register to explore properties</p>


            <form method="POST">

                <label>Name</label>

                <input type="text"
                       name="name"
                       placeholder="Enter your name"
                       required>


                <label>Email</label>

                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>


                <label>Password</label>

                <input type="password"
                       name="password"
                       placeholder="Enter your password"
                       required>


                <button type="submit">
                    Register
                </button>

            </form>


            <p class="auth-link">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </div>

</body>

</html>
